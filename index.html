<!DOCTYPE html>
<html lang="si"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Early Birds"><meta name="theme-color" content="#124a8c">
<title>Early Birds</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
:root{--gb:rgba(255,255,255,.6);padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);box-sizing:border-box}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#124a8c}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(circle at 12% 8%,rgba(140,255,210,.9) 0,transparent 34%),radial-gradient(circle at 92% 16%,rgba(90,185,255,.95) 0,transparent 40%),radial-gradient(circle at 30% 70%,rgba(255,255,255,.18) 0,transparent 22%),radial-gradient(circle at 60% 105%,#3d95e8 0,transparent 55%),linear-gradient(160deg,#0f8a7e,#134f98 55%,#0a2c5c)}
body{font:15px 'Segoe UI',system-ui,sans-serif;color:#fff;text-shadow:0 1px 2px rgba(0,30,60,.65)}
#app{padding-bottom:96px;max-width:760px;margin:0 auto}
.card{position:relative;margin:10px;padding:14px;border-radius:12px;border:1px solid var(--gb);background:linear-gradient(180deg,rgba(255,255,255,.45) 0,rgba(255,255,255,.16) 40%,rgba(255,255,255,.1) 100%);box-shadow:0 8px 26px rgba(0,20,50,.4),inset 0 1px 0 rgba(255,255,255,.8),inset 0 -1px 0 rgba(255,255,255,.2);-webkit-backdrop-filter:blur(16px) saturate(1.6);backdrop-filter:blur(16px) saturate(1.6)}
h3{margin:0 0 10px;font-weight:600;font-size:17px}
.hd{display:flex;justify-content:space-between;align-items:center;gap:6px}
nav{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;gap:4px;overflow-x:auto;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--gb);background:linear-gradient(180deg,rgba(255,255,255,.35),rgba(10,50,100,.55));-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
nav button{flex:1 0 auto;min-width:56px;display:flex;flex-direction:column;align-items:center;font-size:10px;padding:5px 6px;margin:0}
nav button b{font-size:19px;font-weight:400}
button,select,input,textarea{font:inherit;border-radius:6px;padding:9px 12px;margin:3px 3px 3px 0;text-shadow:none}
button{cursor:pointer;color:#06314f;border:1px solid #2a6f9c;background:linear-gradient(#e9f8ff 0,#aadcf7 48%,#62b8ea 52%,#b0e6ff 100%);box-shadow:inset 0 1px 0 #fff,0 1px 3px rgba(0,0,0,.35)}
button:active{filter:brightness(.92)}
button.on{background:linear-gradient(#fff6c8,#ffd66b 48%,#ffb92e 52%,#ffe39a);border-color:#a56a00}
button.ok{background:linear-gradient(#e8ffe8,#9be59b 48%,#3cb64a 52%,#a6f0a6);border-color:#1d7a28}
button.no{background:linear-gradient(#ffeaea,#f3a0a0 48%,#d64545 52%,#f6b0b0);border-color:#8a1f1f}
input,select,textarea{background:rgba(255,255,255,.85);border:1px solid #fff;color:#0a2a3d;font-size:16px;max-width:100%}
.f{display:block;margin:8px 0}.f span{display:block;font-size:12px;margin-bottom:2px}.f input,.f select,textarea{width:100%}
.r{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.28);flex-wrap:wrap}
.neg{color:#ff9a9a;font-weight:700}.pos{color:#a6ffa6;font-weight:700}.off{color:#ffe38a}em{font-style:normal}small{opacity:.9}
.bar{height:10px;border-radius:6px;background:rgba(0,30,60,.4);overflow:hidden;margin:3px 0;box-shadow:inset 0 1px 3px rgba(0,0,0,.4)}.bar i{display:block;height:100%;background:linear-gradient(#cff,#3bd)}
.pie{width:120px;height:120px;border-radius:50%;border:2px solid #fff7}
.gt{position:relative;height:16px;margin:4px 0;background:rgba(0,30,60,.35);border-radius:4px}.gt i{position:absolute;top:0;bottom:0;border-radius:4px;background:linear-gradient(#cff,#28c)}
img.th{height:46px;border-radius:5px;margin-right:4px;vertical-align:middle}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);padding:10px 16px;border-radius:10px;background:rgba(8,36,66,.95);border:1px solid #fff8;z-index:9;max-width:90%;text-align:center}
.emp{opacity:.8;padding:6px 0}
@media print{html,body{background:#fff}body::before,nav,button,.hd,input,select,textarea{display:none}body{color:#000;text-shadow:none}.card{background:#fff;box-shadow:none;border:1px solid #888;-webkit-backdrop-filter:none;backdrop-filter:none}.neg{color:#b00}.pos{color:#060}}
</style></head><body><div id="app"></div>
<script>
/* ===== Firebase (optional): paste your config object here before hosting, e.g. {apiKey:"...",projectId:"..."} ===== */
const FIREBASE_CONFIG=null;
const KEYS=['u','p','c','d','tx','rq','bl','eq','sr','nt','it'];
const ld=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}};
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $=s=>document.querySelector(s),vr=i=>($('#'+i)||{}).value||'',v=i=>esc(vr(i)),L=(a,f)=>a.map(f).join('');
const now=()=>new Date().toISOString(),today=()=>now().slice(0,10),fd=t=>new Date(t).toLocaleString('en-GB'),rs=n=>(n<0?'-':'')+'රු. '+Math.abs(n).toLocaleString();
const uid=()=>Date.now()*10+Math.floor(Math.random()*10),sm=a=>a.reduce((x,y)=>x+y.a,0);
let D=Object.fromEntries(KEYS.map(k=>[k,[]])),Q=ld('ebq',[]),UID=ld('ebu',null),U=null,T='',E=0,DL=0,RP=0,RU=0,PH={},DB=0,LK={},rd={};
const CFG=FIREBASE_CONFIG||ld('ebcfg',null);
if(CFG&&window.firebase){try{firebase.initializeApp(CFG);DB=firebase.firestore();try{DB.enablePersistence({synchronizeTabs:true}).catch(()=>{})}catch(e){}
KEYS.forEach(k=>DB.collection(k).onSnapshot(s=>{D[k]=s.docs.map(d=>d.data()).sort((a,b)=>a.id-b.id);Object.keys(LK).forEach(z=>{if(z.startsWith(k+'/'))delete LK[z]});D[k].forEach(x=>LK[k+'/'+x.id]=JSON.stringify(x));rd[k]=1;sched()},e=>toast('Cloud error: '+e.code)))}catch(e){DB=0}}
if(!DB)Object.assign(D,ld('eb2',{}));
function save(){if(!DB){try{localStorage.setItem('eb2',JSON.stringify(D));localStorage.setItem('ebq',JSON.stringify(Q))}catch(e){toast('Storage පිරී ඇත')}return}
KEYS.forEach(k=>{const seen={};D[k].forEach(x=>{const i=k+'/'+x.id,j=JSON.stringify(x);seen[i]=1;if(LK[i]!==j){LK[i]=j;DB.collection(k).doc(String(x.id)).set(x).catch(e=>toast('Save error: '+e.code))}});
Object.keys(LK).forEach(i=>{if(i.startsWith(k+'/')&&!seen[i]){delete LK[i];DB.collection(k).doc(i.slice(k.length+1)).delete()}})})}
const toast=m=>{const d=document.createElement('div');d.className='toast';d.textContent=m;document.body.appendChild(d);setTimeout(()=>d.remove(),2800)};
const pn=i=>(D.p.find(x=>x.id==i)||{}).n||'-',un=i=>(D.u.find(x=>x.id==i)||{}).n||'-';
const mine=()=>U.r=='A'?D.p:D.p.filter(p=>p.s==U.id),SUP=()=>D.u.filter(u=>u.r=='S');
const spent=p=>sm(D.bl.filter(b=>b.p==p&&b.st!='rej'));
const bal=s=>sm(D.tx.filter(x=>x.s==s&&x.st=='ok'))+sm(D.rq.filter(x=>x.s==s&&x.st=='ok'))-sm(D.bl.filter(x=>x.s==s&&x.st!='rej'));
const balH=n=>`<b class="${n<0?'neg':'pos'}">${rs(n)}</b>`,emp='<div class=emp>තවම නැත</div>';
const st=s=>s=='ok'?'<em class=pos>Approved</em>':s=='rej'?'<em class=neg>Rejected</em>':'<em class=off>Pending</em>';
const popt=a=>L(a,p=>`<option value="${p.id}">${p.n}</option>`),bar=(p,c)=>`<div class=bar><i style="width:${Math.min(100,Math.max(0,p))}%;${c?'background:'+c:''}"></i></div>`;
const fld=(l,h)=>`<label class=f><span>${l}</span>${h}</label>`,card=h=>`<div class=card style="max-width:430px;margin:8vh auto">${h}</div>`;
const hav=(a,b,c,d)=>{const f=x=>x*Math.PI/180,x=f(c-a),y=f(d-b),h=Math.sin(x/2)**2+Math.cos(f(a))*Math.cos(f(c))*Math.sin(y/2)**2;return 12742*Math.asin(Math.sqrt(h))};
const chr=c=>`<div class=r><span>${un(c.s)} • ${pn(c.p)} • ${c.ty=='i'?'Check-in':'Check-out'}${c.off?' <em class=off>Offline record</em>':''}</span><small>${fd(c.t)}</small></div>`;
const thumb=s=>s?`<img class=th src="${s}">`:'';
async function H(p){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('eb:'+p));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){return 'p:'+p}}
function pick(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const c=document.createElement('canvas'),k=Math.min(1,420/i.width);c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);PH[e.target.id]=c.toDataURL('image/jpeg',.55);e.target.nextElementSibling.textContent=' ✔ ඡායාරූපය සූදානම්'};i.src=r.result};r.readAsDataURL(f)}
const file=id=>fld('ඡායාරූපය',`<input type=file accept="image/*" id=${id} onchange="pick(event)"><i></i>`);

/* Setup / login */
function parseCfg(t){try{return JSON.parse(t.slice(t.indexOf('{'),t.lastIndexOf('}')+1).replace(/([{,]\s*)([A-Za-z_]\w*)\s*:/g,'$1"$2":').replace(/,\s*}/g,'}'))}catch(e){return null}}
function useCfg(){const c=parseCfg(vr('cfg'));if(!c||!c.apiKey||!c.projectId)return toast('Config එක වැරදියි (apiKey, projectId ඕන)');try{localStorage.setItem('ebcfg',JSON.stringify(c))}catch(e){}location.reload()}
function offCfg(){try{localStorage.removeItem('ebcfg')}catch(e){}location.reload()}
async function mkAdmin(){const n=v('an').trim(),p=vr('ap');if(!n)return toast('නම දාන්න');if(p.length<4)return toast('Password අකුරු 4ක් හෝ වැඩි විය යුතුයි');if(p!=vr('ap2'))return toast('Password දෙක ගැළපෙන්නේ නැහැ');
const u={id:uid(),n,h:await H(p),r:'A'};D.u.push(u);save();UID=u.id;try{localStorage.setItem('ebu',JSON.stringify(UID))}catch(e){}toast('Setup සම්පූර්ණයි ✔');R()}
async function login(){const u=D.u.find(x=>x.id==vr('lu'));if(!u||u.h!==await H(vr('lp')))return toast('Password වැරදියි');UID=u.id;try{localStorage.setItem('ebu',JSON.stringify(UID))}catch(e){}T='';R()}
function out(){UID=null;try{localStorage.removeItem('ebu')}catch(e){}R()}
async function chPw(){const p=vr('pw1');if(p.length<4)return toast('Password අකුරු 4ක් හෝ වැඩි විය යුතුයි');if(p!=vr('pw2'))return toast('Password දෙක ගැළපෙන්නේ නැහැ');U.h=await H(p);save();toast('Password වෙනස් විය ✔');R()}
async function mkU(){const n=v('un').trim(),p=vr('up');if(!n||p.length<4)return toast('නම සහ Password (4+) දාන්න');if(D.u.some(u=>u.n==n))return toast('මේ නම දැනටමත් තියෙනවා');D.u.push({id:uid(),n,h:await H(p),r:'S'});save();toast('Supervisor එකතු විය ✔');R()}
async function rsU(i){const p=vr('rpw');if(RU!=i){RU=i;return R()}if(p.length<4)return toast('Password (4+) දාන්න');D.u.find(u=>u.id==i).h=await H(p);RU=0;save();toast('Password reset විය ✔');R()}
function delU(i){if(DL!='u'+i){DL='u'+i;return toast('Delete කිරීමට නැවත ඔබන්න')}D.u=D.u.filter(u=>u.id!=i);D.p.forEach(p=>{if(p.s==i)p.s=''});DL=0;save();R()}
const pwCard=()=>`<div class=card><h3>🔑 මගේ Password වෙනස් කරන්න</h3>${fld('අලුත් Password','<input id=pw1 type=password>')}${fld('නැවත','<input id=pw2 type=password>')}<button class=ok onclick=chPw()>Save</button></div>`;

/* Check-in */
function ci(ty){const p=D.p.find(x=>x.id==vr('cp'));if(!p)return toast('Project තෝරන්න');if(p.lat==null)return toast('Admin විසින් site GPS set කළ යුතුයි');
toast('GPS සොයමින්...');navigator.geolocation.getCurrentPosition(g=>{const d=hav(g.coords.latitude,g.coords.longitude,p.lat,p.lng);if(d>1)return toast('Site එකෙන් '+d.toFixed(2)+' km ඈතයි (1 km ඇතුළත විය යුතුයි)');
const r={id:uid(),p:p.id,s:U.id,ty,t:now(),d,off:!navigator.onLine};
if(r.off&&!DB){Q.push(r);toast('Offline: phone එකේ save විය, signal ආවම sync වේ')}else{D.c.push(r);toast(r.off?'Offline: signal ආවම sync වේ':ty=='i'?'Check-in විය ✔':'Check-out විය ✔')}save();R()},()=>toast('GPS ලබාගත නොහැක (Location allow කරන්න)'),{enableHighAccuracy:true,timeout:15000})}
function sync(){if(!DB&&navigator.onLine&&Q.length){D.c.push(...Q);Q=[];save();toast('Offline records sync විය');if(U)R()}}
addEventListener('online',sync);

/* Projects */
const pf=(p,x)=>fld('Project නම',`<input id=${x}n value="${p.n||''}">`)+fld('ස්ථානය',`<input id=${x}l value="${p.l||''}">`)+fld('Supervisor',`<select id=${x}s><option value="">- තෝරන්න -</option>${L(SUP(),u=>`<option value=${u.id} ${u.id==p.s?'selected':''}>${u.n}</option>`)}</select>`)+fld('ආරම්භ දිනය',`<input id=${x}a type=date value="${p.a||today()}">`)+fld('අවසන් දිනය',`<input id=${x}b type=date value="${p.b||today()}">`)+fld('Budget (රු.)',`<input id=${x}bu type=number value="${p.bud||''}">`)+(x=='e'?fld('Progress %',`<input id=ep type=number value="${p.pr||0}">`)+fld('තත්ත්වය',`<select id=est>${['ongoing','hold','done'].map(z=>`<option ${z==p.st?'selected':''}>${z}</option>`).join('')}</select>`):'')+fld('Site GPS (check-in සඳහා)',`<input id=${x}lat placeholder=Latitude value="${p.lat==null?'':p.lat}"><input id=${x}lng placeholder=Longitude value="${p.lng==null?'':p.lng}"><button onclick="gps('${x}')">📍 දැන් ඉන්න තැන ගන්න</button>`);
const rdP=x=>({n:v(x+'n').trim(),l:v(x+'l'),s:vr(x+'s'),a:vr(x+'a'),b:vr(x+'b'),bud:+vr(x+'bu')||0,lat:vr(x+'lat')===''?null:+vr(x+'lat'),lng:vr(x+'lng')===''?null:+vr(x+'lng'),...(x=='e'?{pr:Math.min(100,+vr('ep')||0),st:vr('est')}:{})});
function mkP(){const o=rdP('n');if(!o.n)return toast('Project නම දාන්න');D.p.push({id:uid(),pr:0,st:'ongoing',...o});save();toast('Project එක හැදුවා ✔');R()}
function saveP(i){Object.assign(D.p.find(x=>x.id==i),rdP('e'));E=0;save();toast('Save විය ✔');R()}
function delP(i){if(DL!='p'+i){DL='p'+i;return toast('Delete කිරීමට නැවත ඔබන්න')}D.p=D.p.filter(p=>p.id!=i);DL=0;save();R()}
function gps(x){navigator.geolocation.getCurrentPosition(g=>{$('#'+x+'lat').value=g.coords.latitude;$('#'+x+'lng').value=g.coords.longitude;toast('GPS ලැබුණා ✔')},()=>toast('GPS ලබාගත නොහැක'))}
function addEq(p){const n=v('qn'+p).trim();if(!n)return toast('නම දාන්න');D.eq.push({id:uid(),p,n,q:1,st:0,s:U.id});save();R()}
function retEq(i){const e=D.eq.find(x=>x.id==i);e.rp=1;D.sr.push({id:uid(),ty:'b',s:U.id,p:e.p,it:e.it,q:e.q,eq:e.id,st:'pend',t:now()});save();toast('ආපසු දීමේ ඉල්ලීම යැවුවා');R()}
function pcard(p){const A=U.r=='A';if(A&&E==p.id)return `<div class=card><h3>✏️ Project edit</h3>${pf(p,'e')}<button class=ok onclick=saveP(${p.id})>Save</button><button onclick="E=0;R()">Cancel</button></div>`;
const eq=D.eq.filter(e=>e.p==p.id);
return `<div class=card><div class=r><b>${p.n}</b><span>${p.st}</span></div><div>📍 ${p.l||'-'} • Supervisor: ${p.s?un(p.s):'-'}</div>${bar(p.pr)}<small>Progress ${p.pr}% • ${p.a} → ${p.b}${p.lat==null?' • <em class=off>Site GPS set කර නැත</em>':''}</small><div class=r><span>Budget ${rs(p.bud)}</span><span>වියදම ${rs(spent(p.id))}</span></div>
<b>Equipment</b>${L(eq,e=>`<div class=r><span>${e.n} ×${e.q} ${e.st?'':'<small>(අතින්)</small>'}</span>${U.r=='S'&&e.st?(e.rp?'<em class=off>ආපසු Pending</em>':`<button onclick=retEq(${e.id})>ආපසු දෙන්න</button>`):''}</div>`)||emp}
${A?`<button onclick="E=${p.id};R()">✏️ Edit</button><button class=no onclick=delP(${p.id})>🗑 Delete</button>`:`<label class=f><span>Equipment එකතු කරන්න (Stores නොවන)</span><input id="qn${p.id}"></label><button onclick=addEq(${p.id})>Add</button>`}</div>`}

/* Money, bills, daily, stores */
function sendM(){const a=+vr('ma');if(!(a>0)||!vr('ms'))return toast('Supervisor සහ ප්‍රමාණය දාන්න');D.tx.push({id:uid(),s:vr('ms'),a,p:vr('mp'),st:'pend',t:now()});save();toast('මුදල් යැවුවා (Supervisor තහවුරු කළ යුතුයි)');R()}

if(!U)return card(`<h3>🐦 Early Birds</h3>${fld('පරිශීලක',`<select id=lu>${L(D.u,u=>`<option value=${u.id}>${u.n} (${u.r=='A'?'Admin':'Supervisor'})</option>`)}</select>`)}${fld('Password','<input id=lp type=password onkeydown="if(event.key==\'Enter\')login()">')}<button class=ok onclick=login()>Login</button>`);
const tb=TABS[U.r];if(!tb.some(x=>x[0]==T))T=tb[0][0];
return `<div class="card hd"><b>🐦 Early Birds ${DB?'☁️':''}</b><span>${U.n} <button onclick=out()>Logout</button></span></div>${V[T]()}<nav>${L(tb,x=>`<button class="${x[0]==T?'on':''}" onclick="T='${x[0]}';R()"><b>${x[1]}</b>${x[2]}</button>`)}</nav>`}
function render(keep){U=D.u.find(x=>x.id==UID)||null;const a=$('#app');let sv={},fo='';

try{const c=document.createElement('canvas');c.width=c.height=180;const x=c.getContext('2d'),g=x.createLinearGradient(0,0,180,180);g.addColorStop(0,'#4aa8ff');g.addColorStop(1,'#0e6f6a');x.fillStyle=g;x.fillRect(0,0,180,180);x.font='96px serif';x.textAlign='center';x.fillText('🐦',90,125);const l=document.createElement('link');l.rel='apple-touch-icon';l.href=c.toDataURL('image/png');document.head.appendChild(l)}catch(e){}
sync();render(0);
